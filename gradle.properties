# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false


## Environment Properties

# The Minecraft version must agree with the Forge version to get a valid artifact
minecraft_version=1.20.1
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[1.20.1,1.21)
# The Forge version must agree with the Minecraft version to get a valid artifact
forge_version=47.4.10
# The Forge version range can use any version of Forge as bounds or match the loader version range
forge_version_range=[47,)
# The loader version range can only use the major version of Forge/FML as bounds
loader_version_range=[47,)
# The mapping channel to use for mappings.
# 与同仓库其它 1.20.1 工程保持一致：Parchment 叠加官方映射。
# 机械动力 6.0.x 就是用 Parchment 2023.08.20 构建的，附属模组必须对齐同一版本，
# 否则 Create 自己的 mixin refmap 在开发环境里无法正确应用。
mapping_channel=parchment
# The mapping version to query from the mapping channel.
# This must match the format required by the mapping channel.
mapping_version=2023.08.20-1.20.1


## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=ancient_remnants_add
# The human-readable display name for the mod. Used by mods.toml via ${mod_name}.
mod_name=Ancient Remnants Add
# The license of the mod. Review your options at https://choosealicense.com/.
mod_license=MIT
# The mod version. See https://semver.org/
# NOTE: mods.toml references this via ${mod_version}, so bumping here is enough.
mod_version=1.0.0
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.frnc.ancient_remnants_add
# The authors of the mod. Used by mods.toml via ${mod_authors}.
mod_authors=FRNc
# The description of the mod. 中文说明直接写在 src/main/resources/META-INF/mods.toml 的
# description 字段里：Gradle 以 ISO-8859-1 读取 gradle.properties，非 ASCII 文本放这里
# 打包后会变成乱码（同仓库其它项目目前就有这个问题）。


## 上游一：Create（机械动力）依赖版本

# Create 6.0.x 是 1.20.1 的维护线
create_version=6.0.8-289
# mods.toml 中声明的 Create 版本范围
create_version_range=[6.0.8,6.1.0)
ponder_version=1.0.91
flywheel_version=1.0.5
registrate_version=MC1.20-1.3.3
# MixinExtras：Create 6.0 的 mixin 依赖（slim 分类器剥离了 Create 内嵌的这份库）。
# 0.5.0 与下面的 Fragmentum 内嵌版本一致——生产环境里两份 MixinExtras 并存时，
# Forge 的 jarjar 会取版本更高的那份，所以开发环境跟着用 0.5.0 才能复现生产行为。
mixinextras_version=0.5.0


## 上游二：Ancient Remnants（远古遗迹）依赖版本
#
# 只在 Modrinth 发布（CurseForge 上也有，但 Modrinth 有 maven 仓库，构建更稳），
# 坐标写成 maven.modrinth:<项目 slug>:<版本 id>，仓库见 build.gradle 里的 exclusiveContent。
#
# 为什么用「版本 id」而不是版本号：Modrinth 的 maven 里同一个版本号会对应
# 多个加载器/游戏版本的产物（fabric / forge / neoforge 共用 1.5.2 这个号），
# 用版本 id 才能锁定到 1.20.1-forge 的那一份。

# Ancient Remnants 1.5.2（1.20.1-forge，2026-10-06）
ancient_remnants_version=r3G6hu9a
# mods.toml 中声明的 Ancient Remnants 版本下限
ancient_remnants_version_range=[1.5.2,)
# Fragmentum 5.4.0（1.20.1-forge）——Ancient Remnants 的硬前置框架，
# 它的 mods.toml 里 mandatory=true、版本范围 [5.2.0,)，缺了远古遗迹直接启动失败。
# 本 mod 不直接引用它的类，因此只进开发环境运行时（runtimeOnly）。
fragmentum_version=T7QOSm4k


## 开发环境补齐的库
#
# Fragmentum 用 jarjar 内嵌了下面三个 jar，玩家环境由 Forge 自动解包；
# 但 ForgeGradle 只把依赖 jar 放进开发环境的 classpath，**不会解包 jarjar**，
# 所以开发环境里要自己声明，否则启动时会在 Fragmentum/远古遗迹用到的第一个类上
# NoClassDefFoundError（同仓库 create_improve 也要显式补 Ponder / Flywheel）。

# Kotlin for Forge 4.11.0：远古遗迹与 Fragmentum 都是 Kotlin 写的
kotlinforforge_version=hmeyC41q
# YetAnotherConfigLib 3.6.6+1.20.1-forge：Fragmentum 的游戏内配置界面
yacl_version=sCWgXDYQ
# JEI：可选前置（软依赖），仅用于配方查看兼容
jei_version=15.56.0.205
