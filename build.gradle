plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    // ForgeGradle 6.x 只发布在 maven.minecraftforge.net，该仓库在部分网络下非常慢。
    // 用版本范围 [6.0,6.2) 时每次配置都要先拉 maven-metadata.xml，超时会让整个构建失败；
    // 固定为本地缓存中已验证可用的 6.0.54，静态版本可直接命中缓存。
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    // MixinGradle：SpongePowered 官方 Gradle 插件。ForgeGradle 6 的 UserDevExtension
    // 移除了旧的 `mixin {}` 块，没有这个插件，mixin 配置在开发环境不会被注册，
    // 表现为"编译进 jar 但运行时不触发"。
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    // 映射由 gradle.properties 的 mapping_channel / mapping_version 决定。
    // 必须与 Create 6.0.x 使用的 Parchment 2023.08.20 对齐，否则 Create 的 mixin refmap 在开发环境失效。
    mappings channel: mapping_channel, version: mapping_version

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // 需要公开原版私有成员时取消注释，并在 META-INF/accesstransformer.cfg 里按 AT 语法写规则（保持纯 ASCII）。
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'

            // Remap SRG names inside mixin refmaps to the named (Parchment) mappings of the dev
            // workspace. Without this, refmap entries fail to resolve against the named
            // classes in a dev environment -> "could not find any targets".
            // 放在 configureEach 而不是只放在 client —— server / data 这类运行配置同样会加载
            // Create 与远古遗迹，缺了它会在 mixin 应用阶段直接崩掉。
            // See https://github.com/SpongePowered/Mixin/issues/462
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // 本 mod 目前没有 DataProvider，这个 run config 只在接入 datagen 后才有输出。
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Mixin 配置：编译期生成 ancient_remnants_add.refmap.json 并注册 mixin 配置，
// jar 清单里会自动写入 MixinConfigs（Forge 据此加载本 mod 的 mixin）。
// 新增 mixin 类时，记得同步补进 ancient_remnants_add.mixins.json 的 mixins / client 列表
// ——漏了会表现为"类编译进 jar 但注入从不生效"，不会报错。
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // ForgeGradle 已经自带 Forge maven；这里补上 Central，避免部分传递依赖只存在于 Central 时解析失败。
    mavenCentral()

    // Create 依赖栈
    maven { url = "https://maven.createmod.net" }        // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/mirror" }  // Registrate

    // JEI（可选前置）：三个仓库互为镜像，任一可用即可解析
    maven {
        name = "Progwml6's maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }

    // 远古遗迹（Ancient Remnants）、Fragmentum 与开发环境补齐的库都只在 Modrinth 发布。
    // 用 exclusiveContent 把 maven.modrinth 这个 group 独占给 Modrinth，避免 Gradle 去别的仓库瞎找；
    // forRepositories(fg.repository) 是 ForgeGradle 的写法，少了它 Forge 自身的依赖会解析不到。
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        forRepositories(fg.repository)
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    // Specify the version of Minecraft to use.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // ---- 可选联动：机械动力（Create）----
    // Create 不是硬依赖：玩家没装 Create 也能启动。compileOnly 只用于编译期引用，
    // runtimeOnly 只把 Create 拉进开发环境方便联调，不会打进本 mod 的 jar。
    // 以后新增直接引用 Create 类的代码时，务必用 ModList.get().isLoaded(CREATE_MOD_ID)
    // 或单独的 @Mod.EventBusSubscriber 隔离，避免没装 Create 时类加载失败。
    compileOnly(fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false })
    compileOnly(fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}"))
    compileOnly(fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}"))
    compileOnly(fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}"))
    runtimeOnly(fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false })
    runtimeOnly(fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}"))
    runtimeOnly(fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}"))
    runtimeOnly(fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}"))

    // ---- 可选联动二：Explorer's Compass（结构指南针）----
    // 软依赖：编译期可见、开发环境运行时可用，不打包；玩家装了才启用联动。
    // 以后引用它的类必须做存在性隔离（见 README 约定），否则没装时会在类加载阶段失败。
    compileOnly fg.deobf("maven.modrinth:explorers-compass:${explorers_compass_version}")
    runtimeOnly fg.deobf("maven.modrinth:explorers-compass:${explorers_compass_version}")

    // ---- 可选联动三 / 四：Xaero's Minimap、Xaero's World Map（小地图 / 世界地图）----
    // 两者都是客户端模组（服务端可选），所以是 side=CLIENT 的软依赖：
    // 编译期可见、开发环境运行时可用，不打包；玩家装了才会进入联动分支。
    compileOnly fg.deobf("maven.modrinth:xaeros-minimap:${xaeros_minimap_version}")
    runtimeOnly fg.deobf("maven.modrinth:xaeros-minimap:${xaeros_minimap_version}")
    compileOnly fg.deobf("maven.modrinth:xaeros-world-map:${xaeros_world_map_version}")
    runtimeOnly fg.deobf("maven.modrinth:xaeros-world-map:${xaeros_world_map_version}")

    // ---- 上游二：远古遗迹（Ancient Remnants）----
    // 代码需要直接引用它的类（本 mod 就是给它做扩展的），所以用 implementation。
    // implementation = 编译期可见 + 开发环境运行时可用；玩家环境由 mods.toml 的 mandatory 依赖保证。
    implementation fg.deobf("maven.modrinth:ancient-remnants:${ancient_remnants_version}")
    // Fragmentum 是远古遗迹的硬前置。上游类的公开签名里带有它的类型
    // （例如 Blessing 的效果字段是 Deferred<MobEffect>），编译期需要可见；
    // 玩家环境由 Ancient Remnants 的 mandatory 依赖保证，不随本 mod 打包。
    compileOnly fg.deobf("maven.modrinth:fragmentum:${fragmentum_version}")
    runtimeOnly fg.deobf("maven.modrinth:fragmentum:${fragmentum_version}")

    // ---- 开发环境补齐（生产环境由 Fragmentum 的 jarjar 提供，不随本 mod 分发）----
    // MixinExtras 是 Create 6.0 的 mixin 依赖（如 BuiltInRegistriesMixin 使用 @WrapOperation），
    // slim 分类器把 Create 内嵌库剥离了；Fragmentum 也内嵌了一份。玩家环境由 jarjar 提供，
    // 开发环境必须显式补上，否则 mixin 应用阶段会 ClassMetadataNotFoundException。
    compileOnly "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
    runtimeOnly "io.github.llamalad7:mixinextras-forge:${mixinextras_version}"
    // 远古遗迹与 Fragmentum 是 Kotlin 写的，Kotlin for Forge 提供 Kotlin 运行时。
    runtimeOnly fg.deobf("maven.modrinth:kotlin-for-forge:${kotlinforforge_version}")
    // Fragmentum 的游戏内配置界面基于 YACL。
    runtimeOnly fg.deobf("maven.modrinth:yacl:${yacl_version}")

    // JEI 是可选前置（mods.toml 里 mandatory=false）：编译期只用 API，运行期用完整 jar。
    // 未安装 JEI 的整合包不加载这些类，不影响启动。
    compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"))
    compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"))
    runtimeOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}"))

    // Mixin 注解处理器：生成 refmap。即使当前还没有 mixin 也保留它，
    // 这样第一个 mixin 加进来时不需要再改构建脚本。
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    // 显式按 UTF-8 读取模板并写出结果，否则在默认字符集不是 UTF-8 的机器上，
    // mods.toml / pack.mcmeta 里的中文会乱码。
    filteringCharset = 'UTF-8'

    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors,
            create_version_range: create_version_range,
            ancient_remnants_version_range: ancient_remnants_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                // 告诉 Forge 加载哪个 mixin 配置（MixinGradle 也会写一次，这里显式保留便于排查）
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
