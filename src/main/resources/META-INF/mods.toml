modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]

modId="${mod_id}"

version="${mod_version}"

displayName="${mod_name}"

authors="${mod_authors}"

# 说明文本直接写在这里（不要放进 gradle.properties：那里被 Gradle 以 ISO-8859-1 读取，中文会乱码）。
description='''远古遗迹（Ancient Remnants）的附属模组，并与机械动力（Create）做可选联动。'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# 机械动力：可选联动模组。没装 Create 时本 mod 仍可启动；
# 装了则 AFTER 让 Create 先完成注册，便于联动代码读取它的注册表。
# 版本范围故意放宽到 *：当前没有必须匹配的 Create API，具体联动代码自行判断版本。
[[dependencies.${mod_id}]]
    modId="create"
    mandatory=false
    versionRange="*"
    ordering="AFTER"
    side="BOTH"

# Explorer's Compass（结构指南针）：可选联动，装了才启用相关联动，没装不影响启动。
# modId 取自它自己的 mods.toml（explorerscompass）；两边都是 client+server，所以 side=BOTH。
[[dependencies.${mod_id}]]
    modId="explorerscompass"
    mandatory=false
    versionRange="*"
    ordering="NONE"
    side="BOTH"

# Xaero's Minimap / Xaero's World Map：客户端模组（服务端可选），按 CLIENT 侧的软依赖声明。
# modId 取自它们自己的注册命名空间（xaerominimap / xaeroworldmap）；没装不影响启动。
[[dependencies.${mod_id}]]
    modId="xaerominimap"
    mandatory=false
    versionRange="*"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="xaeroworldmap"
    mandatory=false
    versionRange="*"
    ordering="NONE"
    side="CLIENT"

# 远古遗迹：另一个上游，本 mod 直接引用它的类（缺了会 NoClassDefFoundError），因此 mandatory=true。
# 它自己硬依赖框架 Fragmentum，版本范围由它的 mods.toml 声明，这里不必重复。
[[dependencies.${mod_id}]]
    modId="ancient_remnants"
    mandatory=true
    versionRange="${ancient_remnants_version_range}"
    ordering="AFTER"
    side="BOTH"

# JEI：只是可选兼容（装了就能查本 mod 的配方，没装不影响主功能），
# 因此 mandatory=false；side=CLIENT 因为 JEI 本身只在客户端有意义。
[[dependencies.${mod_id}]]
    modId="jei"
    mandatory=false
    versionRange="*"
    ordering="NONE"
    side="CLIENT"
